services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - services/auth-service/.env
    environment:
      DATABASE_URL: postgres://smart_campus:smart_campus_dev_password@postgres:5432/smart_campus?schema=auth_service
    depends_on:
      - postgres

  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - services/student-service/.env
    environment:
      DATABASE_URL: postgres://smart_campus:smart_campus_dev_password@postgres:5432/smart_campus?schema=student_service
    depends_on:
      - postgres

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - services/course-service/.env
    environment:
      DATABASE_URL: postgres://smart_campus:smart_campus_dev_password@postgres:5432/smart_campus?schema=course_service
    depends_on:
      - postgres

  attendance-service:
    build:
      context: .
      dockerfile: services/attendance-service/Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - services/attendance-service/.env
    environment:
      DATABASE_URL: postgres://smart_campus:smart_campus_dev_password@postgres:5432/smart_campus?schema=attendance_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3005:3005"
    env_file:
      - services/notification-service/.env
    environment:
      DATABASE_URL: postgres://smart_campus:smart_campus_dev_password@postgres:5432/smart_campus?schema=notification_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "3006:3006"
    env_file:
      - services/analytics-service/.env
    environment:
      DATABASE_URL: postgres://smart_campus:smart_campus_dev_password@postgres:5432/smart_campus?schema=analytics_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - services/api-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      STUDENT_SERVICE_URL: http://student-service:3002
      COURSE_SERVICE_URL: http://course-service:3003
      ATTENDANCE_SERVICE_URL: http://attendance-service:3004
    depends_on:
      - auth-service
      - student-service
      - course-service
      - attendance-service
    
  postgres:
    image: postgres:16    # image: postgres:16 instead of build: ... — tells Compose "pull this pre-built image from Docker Hub," rather than building one from a Dockerfile we wrote
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_data: